services:
  - type: web
    name: django-notes-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn notes_project.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notes-db
          property: connectionString

databases:
  - name: notes-db
    plan: free